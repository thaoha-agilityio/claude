# Checks from CLAUDE.md, run on merge requests and on pushes to feat/practice and the default branch.
# No deploy: the API has no auth and keeps its data on disk (see .claude/skills/deploy-setup/SKILL.md).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open MR already gets the MR pipeline; don't run it twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "feat/practice" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [check, build, e2e]

default:
  image: node:24-bookworm-slim
  interruptible: true
  # tags: [docker]   # uncomment with the runner's tags if jobs stay pending
  cache:
    key:
      files: [expense-tracker/package-lock.json]
    paths: [.npm/]
  before_script:
    - cd expense-tracker
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline

unit:
  stage: check
  script:
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
  artifacts:
    when: always
    reports:
      junit: expense-tracker/junit.xml

typecheck:
  stage: check
  script:
    - npm run typecheck

lint:
  stage: check
  script:
    - npm run lint

# The PreToolUse hook that blocks push/reset/rebase for Claude; its tests need no npm install.
hooks:
  stage: check
  before_script: []
  script:
    - node --test .claude/hooks/*.test.mjs

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths: [expense-tracker/dist/]
    expire_in: 1 week

# Builds and serves the app itself (playwright.config.ts webServer), so it doesn't need the build job.
e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  needs: []
  script:
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - expense-tracker/playwright-report/
      - expense-tracker/test-results/
    reports:
      junit: expense-tracker/test-results/junit.xml
    expire_in: 1 week
