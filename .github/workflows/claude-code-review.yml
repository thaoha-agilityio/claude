# Reviews every PR automatically when it is opened or updated, and posts
# inline comments plus one summary comment.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first and check the diff against its rules,
            especially the domain rules (VND money as safe integers, YYYY-MM-DD dates and
            todayInHcm(), NFC text length, storage versioning and migrate(), repository as the
            only writer) and "a bug fix comes with a test that fails without the fix".

            Report only real problems: bugs, security issues, broken rules, missing tests.
            Skip style nits that lint already covers, and don't praise the code.

            Put each finding as an inline comment on the line it concerns with
            mcp__github_inline_comment__create_inline_comment (confirmed: true). Then post one
            short summary with `gh pr comment`. If you find nothing, say so in the summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
